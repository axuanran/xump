name: Secrets Check

# Read-only verification of every repository secret / variable used by the release
# pipeline. Run it after rotating credentials; it never writes to R2, Telegram,
# the overlay repo or any release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: verify credentials
    runs-on: ubuntu-latest
    steps:
      - name: Android keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for n in KS_B64 KS_PWD KEY_ALIAS KEY_PWD; do
            test -n "${!n}" || { echo "::error::missing secret $n"; exit 1; }
          done
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          keytool -list -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -alias "$KEY_ALIAS" \
            -storepass "$KS_PWD" > "$RUNNER_TEMP/ks.txt"
          grep -q "SHA256:" "$RUNNER_TEMP/ks.txt" || { echo "::error::keystore unreadable"; exit 1; }
          # verify the key password actually unlocks the private key entry
          keytool -certreq -alias "$KEY_ALIAS" -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$KS_PWD" -keypass "$KEY_PWD" > /dev/null
          fingerprint="$(grep -o 'SHA256:.*' "$RUNNER_TEMP/ks.txt" | head -1)"
          echo "keystore OK, alias=$KEY_ALIAS"
          echo "$fingerprint"

      - name: Telegram bot
        env:
          T_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          T_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$T_TOKEN" || { echo "::error::missing TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$T_CHAT" || { echo "::error::missing TELEGRAM_CHAT_ID"; exit 1; }
          bot="$(curl -fsS "https://api.telegram.org/bot${T_TOKEN}/getMe")"
          echo "bot: $(printf '%s' "$bot" | jq -r '.result.username')"
          chat="$(curl -fsS "https://api.telegram.org/bot${T_TOKEN}/getChat?chat_id=${T_CHAT}")"
          echo "chat: $(printf '%s' "$chat" | jq -r '.result.title')"

      - name: Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          for n in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET_NAME; do
            test -n "${!n}" || { echo "::error::missing $n"; exit 1; }
          done
          aws s3 ls "s3://${R2_BUCKET_NAME}/tui/" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --summarize

      - name: RELEASE_TOKEN
        env:
          GH_PAT: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$GH_PAT" || { echo "::error::missing RELEASE_TOKEN"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}")"
          echo "repo api status: $code"
          test "$code" = "200" || { echo "::error::RELEASE_TOKEN rejected (HTTP $code)"; exit 1; }
          # a token that cannot push would still fail at release time; probe write scope
          push="$(curl -s -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}" | jq -r '.permissions.push')"
          echo "push permission: $push"
          test "$push" = "true" || { echo "::error::RELEASE_TOKEN cannot push"; exit 1; }

      - name: XR overlay deploy key
        env:
          DEPLOY_KEY: ${{ secrets.XR_OVERLAY_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "::error::missing XR_OVERLAY_DEPLOY_KEY"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_overlay
          chmod 600 ~/.ssh/id_overlay
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_overlay -o IdentitiesOnly=yes -o BatchMode=yes" \
            git ls-remote git@github.com:axuanran/xr-overlay.git | head -3
          echo "deploy key OK"
